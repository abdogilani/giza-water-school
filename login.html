<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل دخول الإدارة | مدرسة مياه الشرب</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif}.hero{background:linear-gradient(135deg,#0a192f 0%,#0c4a6e 60%,#0284c7 100%)}</style></head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4"><main class="w-full max-w-md"><div class="text-center mb-7"><a href="./index.html" class="inline-flex items-center gap-3 text-brand-900"><span class="w-14 h-14 rounded-2xl hero flex items-center justify-center text-white text-2xl shadow-lg"><i class="fa-solid fa-droplet"></i></span></a><h1 class="text-2xl font-black text-slate-900 mt-4">بوابة إدارة المدرسة</h1><p class="text-slate-500 text-sm mt-1">المدرسة الثانوية الفنية لمياه الشرب والصرف الصحي بالجيزة</p></div>
<section class="bg-white rounded-3xl border border-slate-200 shadow-xl p-7"><div class="text-center mb-6"><h2 class="text-xl font-extrabold text-slate-900">تسجيل الدخول</h2><p class="text-sm text-slate-500 mt-1">مخصصة لحسابات الإدارة المعتمدة فقط</p></div>
<form id="loginForm" class="space-y-4"><label class="block text-sm font-bold text-slate-700">البريد الإلكتروني<input id="email" type="email" autocomplete="username" required maxlength="254" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100" placeholder="admin@example.com"></label><label class="block text-sm font-bold text-slate-700">كلمة المرور<input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100" placeholder="••••••••"></label><button id="submitBtn" class="w-full hero text-white rounded-xl py-3 font-bold hover:opacity-95 transition" type="submit">دخول آمن <i class="fa-solid fa-arrow-left mr-1"></i></button><p id="message" role="status" aria-live="polite" class="text-sm text-center"></p></form>
</section><p class="text-center text-xs text-slate-400 mt-5"><a href="./index.html" class="hover:text-sky-700"><i class="fa-solid fa-arrow-right ml-1"></i>العودة للموقع الرئيسي</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="./js/config.js"></script><script>
const form=document.getElementById('loginForm'),msg=document.getElementById('message'),btn=document.getElementById('submitBtn');
function show(t,ok=false){msg.textContent=t;msg.className='text-sm text-center '+(ok?'text-emerald-700':'text-red-600')}
form.addEventListener('submit',async e=>{e.preventDefault();if(!window.schoolSupabase){show('إعداد Supabase غير مكتمل. راجع js/config.js');return}btn.disabled=true;btn.textContent='جارٍ التحقق...';
try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await schoolSupabase.auth.signInWithPassword({email,password});if(error)throw error;
const {data:userResult,error:userLookupError}=await schoolSupabase.auth.getUser();if(userLookupError||!userResult.user)throw new Error('تعذر التحقق من الحساب.');const {data:roleData,error:roleError}=await schoolSupabase.from('user_roles').select('role').eq('user_id',userResult.user.id).maybeSingle();if(roleError||roleData?.role!=='admin'){await schoolSupabase.auth.signOut();throw new Error('هذا الحساب غير مصرح له بدخول لوحة الإدارة.');}
location.replace('./admin.html');}catch(err){show(err.message==='Invalid login credentials'?'بيانات الدخول غير صحيحة.':(err.message||'تعذر تسجيل الدخول.'))}finally{btn.disabled=false;btn.innerHTML='دخول آمن <i class="fa-solid fa-arrow-left mr-1"></i>'}});
</script></body></html>
