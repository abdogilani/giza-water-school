<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | مدرسة مياه الشرب</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif}.hero{background:linear-gradient(135deg,#0a192f 0%,#0c4a6e 60%,#0284c7 100%)}</style></head>
<body class="bg-slate-50 min-h-screen"><header class="hero text-white shadow-lg"><div class="max-w-6xl mx-auto px-4 py-5 flex items-center justify-between gap-3"><div class="flex items-center gap-3"><span class="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center text-xl"><i class="fa-solid fa-droplet"></i></span><div><h1 class="font-extrabold">لوحة إدارة المدرسة</h1><p class="text-xs text-sky-100">إدارة الإنجازات والمحتوى المنشور</p></div></div><button id="logout" class="bg-white/15 hover:bg-white/25 px-4 py-2 rounded-xl text-sm font-bold"><i class="fa-solid fa-right-from-bracket ml-1"></i>خروج</button></div></header>
<main class="max-w-6xl mx-auto p-4 py-8"><div class="flex flex-wrap justify-between items-center gap-3 mb-6"><div><h2 class="text-2xl font-black text-slate-900">الإنجازات</h2><p class="text-sm text-slate-500">أضف إنجازًا جديدًا أو عدّل المحتوى الحالي.</p></div><a href="./index.html" class="text-sky-700 font-bold text-sm hover:underline">عرض الموقع <i class="fa-solid fa-arrow-up-left-from-square mr-1"></i></a></div>
<div class="grid lg:grid-cols-5 gap-6"><section class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm h-fit"><h3 id="formTitle" class="font-extrabold text-lg mb-4">إضافة إنجاز</h3><form id="achievementForm" class="space-y-3"><input type="hidden" id="recordId"><label class="block text-sm font-bold">عنوان الإنجاز<input id="title" required maxlength="120" class="mt-1 w-full border rounded-xl p-3 font-normal" /></label><label class="block text-sm font-bold">التاريخ الظاهر<input id="dateLabel" required maxlength="40" placeholder="نوفمبر 2026" class="mt-1 w-full border rounded-xl p-3 font-normal" /></label><label class="block text-sm font-bold">الوصف<textarea id="description" required maxlength="1200" rows="4" class="mt-1 w-full border rounded-xl p-3 font-normal"></textarea></label><label class="block text-sm font-bold">رابط الصورة (HTTPS)<input id="imageUrl" type="url" maxlength="500" placeholder="https://..." class="mt-1 w-full border rounded-xl p-3 font-normal" /></label><label class="flex items-center gap-2 text-sm"><input id="published" type="checkbox" checked class="accent-sky-700"> نشر الإنجاز على الموقع</label><div class="flex gap-2"><button id="saveBtn" class="hero text-white rounded-xl px-5 py-3 font-bold flex-1" type="submit">حفظ</button><button id="cancelEdit" type="button" class="hidden border rounded-xl px-4 py-3 font-bold">إلغاء</button></div><p id="formMessage" role="status" aria-live="polite" class="text-sm"></p></form></section>
<section class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm"><div class="flex justify-between items-center mb-4"><h3 class="font-extrabold text-lg">المحتوى الحالي</h3><button id="refresh" class="text-sky-700 text-sm font-bold"><i class="fa-solid fa-rotate ml-1"></i>تحديث</button></div><div id="records" class="space-y-3"><p class="text-slate-500 text-sm">جارٍ التحميل...</p></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="./js/config.js"></script><script>
const $=id=>document.getElementById(id);let client=null;
function message(t,ok=false){$('formMessage').textContent=t;$('formMessage').className='text-sm '+(ok?'text-emerald-700':'text-red-600')}
function safeUrl(v){if(!v)return null;try{const u=new URL(v);return u.protocol==='https:'?u.href:null}catch{return null}}
async function guard(){if(!window.schoolSupabase){location.replace('./login.html');return false}client=window.schoolSupabase;const {data:{session}}=await client.auth.getSession();if(!session){location.replace('./login.html');return false}const {data:userData,error:userError}=await client.auth.getUser();if(userError||!userData.user){location.replace('./login.html');return false}const {data:roleData,error}=await client.from('user_roles').select('role').eq('user_id',userData.user.id).maybeSingle();if(error||roleData?.role!=='admin'){await client.auth.signOut();location.replace('./login.html');return false}return true}
async function load(){const {data,error}=await client.from('achievements').select('*').order('created_at',{ascending:false});if(error){$('records').textContent='تعذر تحميل البيانات: '+error.message;return}$('records').replaceChildren();if(!data.length){$('records').textContent='لا توجد إنجازات حتى الآن.';return}for(const r of data){const card=document.createElement('article');card.className='border rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3';const info=document.createElement('div');const h=document.createElement('h4');h.className='font-bold';h.textContent=r.title;const p=document.createElement('p');p.className='text-xs text-slate-500 mt-1';p.textContent=(r.date_label||'')+' · '+(r.is_published?'منشور':'مسودة');info.append(h,p);const actions=document.createElement('div');actions.className='flex gap-2';const edit=document.createElement('button');edit.className='text-sky-700 border rounded-lg px-3 py-2 text-sm font-bold';edit.textContent='تعديل';edit.addEventListener('click',()=>editRecord(r));const del=document.createElement('button');del.className='text-red-700 border rounded-lg px-3 py-2 text-sm font-bold';del.textContent='حذف';del.addEventListener('click',()=>deleteRecord(r.id));actions.append(edit,del);card.append(info,actions);$('records').append(card)}}
function editRecord(r){$('recordId').value=r.id;$('title').value=r.title;$('dateLabel').value=r.date_label;$('description').value=r.description;$('imageUrl').value=r.image_url||'';$('published').checked=r.is_published;$('formTitle').textContent='تعديل الإنجاز';$('saveBtn').textContent='حفظ التعديلات';$('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function resetForm(){$('achievementForm').reset();$('recordId').value='';$('published').checked=true;$('formTitle').textContent='إضافة إنجاز';$('saveBtn').textContent='حفظ';$('cancelEdit').classList.add('hidden')}
$('achievementForm').addEventListener('submit',async e=>{e.preventDefault();const title=$('title').value.trim(),date_label=$('dateLabel').value.trim(),description=$('description').value.trim(),raw=$('imageUrl').value.trim(),image_url=safeUrl(raw);if(!title||!date_label||!description){message('أكمل الحقول المطلوبة.');return}if(raw&&!image_url){message('رابط الصورة يجب أن يبدأ بـ HTTPS.');return}const payload={title,date_label,description,image_url,is_published:$('published').checked};$('saveBtn').disabled=true;try{const id=$('recordId').value;const result=id?await client.from('achievements').update(payload).eq('id',id):await client.from('achievements').insert(payload);if(result.error)throw result.error;message('تم حفظ البيانات بنجاح.',true);resetForm();await load()}catch(err){message('فشل الحفظ: '+err.message)}finally{$('saveBtn').disabled=false}});
async function deleteRecord(id){if(!confirm('هل تريد حذف هذا الإنجاز نهائيًا؟'))return;const {error}=await client.from('achievements').delete().eq('id',id);if(error){message('فشل الحذف: '+error.message);return}message('تم حذف الإنجاز.',true);await load()}
$('cancelEdit').addEventListener('click',resetForm);$('refresh').addEventListener('click',load);$('logout').addEventListener('click',async()=>{await client.auth.signOut();location.replace('./login.html')});
(async()=>{if(await guard())await load()})();
</script></body></html>
